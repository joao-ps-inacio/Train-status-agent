name: Commute check

on:
  # Disparado à hora certa pelo cron-job.org através da API do GitHub, porque o schedule do GitHub chega com atrasos.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só imprimir, sem enviar para o Telegram"
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run train-status-agent ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}