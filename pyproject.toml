[project]
name = "train-status-agent"
version = "0.1.0"
description = "Daily check of the commute (MTS + Fertagus) with alerts sent to Telegram"
readme = "README.md"
license = "MIT"
authors = [
    { name = "João Inácio" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.1.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
]

[project.scripts]
train-status-agent = "train_status_agent.main:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
