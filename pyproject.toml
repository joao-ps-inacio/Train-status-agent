[project]
name = "train-status-agent"
version = "0.1.0"
description = "Daily check of the commute (MTS + Fertagus) with alerts sent to Telegram"
readme = "README.md"
authors = [
    { name = "João Inácio", email = "joaopinacio96@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.1.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
]

[project.scripts]
train-status-agent = "train_status_agent.main:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
